name: MNQ daily paper test
on:
  schedule:
    - cron: '45 21 * * 1-5'
    - cron: '30 11 * * 2-6'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Run the day's paper test
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mnq_eod_paper.py --source databento --workdir mnq_eod_live
      - name: Save results back to the repository
        run: |
          git config user.name "mnq-paper-bot"; git config user.email "bot@users.noreply.github.com"
          git add mnq_eod_live && (git diff --cached --quiet || git commit -m "paper test $(date -u +%F)") && git push
